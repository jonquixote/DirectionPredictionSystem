# ofi-lab-v3 Dashboard API — Nginx reverse proxy configuration
# Install to /etc/nginx/sites-available/v3-dashboard
# Enable with: sudo ln -s /etc/nginx/sites-available/v3-dashboard /etc/nginx/sites-enabled/

upstream v3_dashboard {
    server 127.0.0.1:8081 fail_timeout=0;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.example.com;  # Replace with your domain
    root /var/www/dps-dash;

    # SSL/TLS configuration
    ssl_certificate /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/v3-dashboard-access.log;
    error_log /var/log/nginx/v3-dashboard-error.log warn;

    # HTTP to HTTPS redirect
    if ($scheme != "https") {
        return 301 https://$server_name$request_uri;
    }

    # Serve React frontend from /var/www/dps-dash
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (React app)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy API calls to FastAPI backend
    location /api/ {
        proxy_pass http://v3_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # WebSocket support
        proxy_cache_bypass $http_upgrade;
    }

}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
