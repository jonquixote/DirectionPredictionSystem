server {
    server_name bet.octavo.press;
    root /var/www/dps-dash;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    # /api/kalshi-orders legacy alias
    location = /api/kalshi-orders {
        proxy_pass http://127.0.0.1:8081/api/kalshi/orders$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ALL /api/* (including /api/kalshi/*) go through dashboard_api on 8081
    # dashboard_api proxies /kalshi/* to runtime API on 8080 with auth translation
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bet.octavo.press/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bet.octavo.press/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = bet.octavo.press) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name bet.octavo.press;
    return 404;
}
